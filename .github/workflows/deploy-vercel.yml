# Vercel deploy — manually triggered only. No auto-deploy on merge.
#
# Run via Actions → "Vercel deploy" → "Run workflow":
#   target      = tuner | docs | both   (which project to ship)
#   environment = production | preview  (preview ships to a throwaway URL)
#
# Requires repo secrets:
#   VERCEL_TOKEN                  — created at https://vercel.com/account/tokens
#   VERCEL_ORG_ID                 — from .vercel/project.json after `vercel link`
#   VERCEL_TUNER_PROJECT_ID       — from canshift-tuner/.vercel/project.json
#   VERCEL_DOCS_PROJECT_ID        — from canshift-docs/.vercel/project.json
#
# Vercel's own Git integration must stay DISCONNECTED for both projects
# (Vercel dashboard → Project → Settings → Git → Disconnect). Otherwise
# every push to main auto-deploys behind this workflow's back.

name: Vercel deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which project to deploy
        type: choice
        required: true
        default: tuner
        options:
          - tuner
          - docs
          - both
      environment:
        description: Deployment environment
        type: choice
        required: true
        default: production
        options:
          - production
          - preview

concurrency:
  group: vercel-deploy-${{ inputs.target }}-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  tuner:
    if: ${{ inputs.target == 'tuner' || inputs.target == 'both' }}
    name: tuner → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_TUNER_PROJECT_ID }}
    defaults:
      run:
        working-directory: canshift-tuner
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          fi

      - name: Build
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Tuner deployed::$URL"

  docs:
    if: ${{ inputs.target == 'docs' || inputs.target == 'both' }}
    name: docs → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
    defaults:
      run:
        working-directory: canshift-docs
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          fi

      - name: Build
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Docs deployed::$URL"
