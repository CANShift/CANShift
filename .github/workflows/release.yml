# Release — triggered by pushing a version tag (v*)
# Builds the Electron desktop app and publishes to GitHub Releases (draft).
# electron-builder handles artifact upload and generates latest-mac.yml / latest.yml
# which are required by electron-updater for auto-update.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Run CI checks first
  ci-check:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  # Build and publish the Electron app
  release:
    name: Build & release
    needs: ci-check
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: canshift-studio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            canshift-core/package-lock.json
            canshift-studio/package-lock.json

      - name: Install core dependencies
        run: npm ci
        working-directory: canshift-core

      - name: Build core
        run: npm run build
        working-directory: canshift-core

      - name: Install studio dependencies
        run: npm ci

      # electron-builder publishes directly to GitHub Releases when GH_TOKEN is set.
      # It uploads the installer + the latest-*.yml manifest used by electron-updater.
      - name: Build and publish
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
