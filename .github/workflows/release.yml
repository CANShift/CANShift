# Release — triggered by every merge to main.
# A release is only created when canshift-studio/package.json version is new.
# If the version already has a GitHub Release, the workflow exits silently.
#
# To ship a release: bump the version in canshift-studio/package.json in your PR.
# When that PR merges, this workflow fires and creates the GitHub Release automatically.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # Detect whether this push introduces a new studio version
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4

      - name: Read studio version
        id: ver
        run: |
          VERSION=$(node -p "require('./canshift-studio/package.json').version")
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.ver.outputs.tag }} already exists — skipping."
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "New version ${{ steps.ver.outputs.tag }} — will release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and publish the Electron studio app
  studio-release:
    name: Studio — build & release (${{ matrix.os }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: canshift-studio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            canshift-core/package-lock.json
            canshift-studio/package-lock.json

      - name: Install core dependencies
        run: npm ci
        working-directory: canshift-core

      - name: Build core
        run: npm run build
        working-directory: canshift-core

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libfuse2

      - name: Install studio dependencies
        run: npm ci

      # electron-builder publishes directly to GitHub Releases when GH_TOKEN is set.
      # Creates a draft release tagged with the studio package version.
      - name: Build and publish
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build firmware and attach .bin files to the same GitHub Release
  firmware-release:
    name: Firmware — build & attach
    needs: [check-version, studio-release]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canshift-firmware

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.packages
            ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('canshift-firmware/platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO CLI
        run: pip install platformio

      - name: Build production firmware
        run: platformio run -e crowpanel_28

      - name: Assert APP_VERSION_STR was injected into firmware binary
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          ELF=.pio/build/crowpanel_28/firmware.elf
          if ! strings "$ELF" | grep -qF "CANShift v${VERSION} starting"; then
            echo "::error::APP_VERSION_STR mismatch — expected v${VERSION} in $ELF"
            echo "extra_targets.py likely failed to inject the macro into projenv."
            strings "$ELF" | grep -E "CANShift v|0\.0\.0-unset" | head -5
            exit 1
          fi
          echo "APP_VERSION_STR=v${VERSION} confirmed in firmware ELF."

      - name: Build SPIFFS image
        run: platformio run --target buildfs -e crowpanel_28

      - name: Stage release assets (firmware partition, merged image, SPIFFS)
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          pip install esptool
          # Merged factory image — USB esptool flashing only (bootloader + partitions + firmware).
          python -m esptool --chip esp32 merge_bin \
            -o canshift-firmware-${TAG}-crowpanel_28-merged.bin \
            0x1000 .pio/build/crowpanel_28/bootloader.bin \
            0x8000 .pio/build/crowpanel_28/partitions.bin \
            0x10000 .pio/build/crowpanel_28/firmware.bin
          # Firmware-partition image — what mobile / studio OTA must consume.
          cp .pio/build/crowpanel_28/firmware.bin canshift-firmware-${TAG}-crowpanel_28-firmware.bin
          # SPIFFS image — flashed to the data partition.
          cp .pio/build/crowpanel_28/spiffs.bin canshift-spiffs-${TAG}-crowpanel_28.bin

      - name: Attach firmware, OTA partition image and SPIFFS to GitHub Release
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          MERGED="canshift-firmware-${TAG}-crowpanel_28-merged.bin"
          OTA="canshift-firmware-${TAG}-crowpanel_28-firmware.bin"
          FS="canshift-spiffs-${TAG}-crowpanel_28.bin"
          for i in 1 2 3 4 5; do
            gh release upload "${TAG}" "${MERGED}" "${OTA}" "${FS}" --clobber && break
            echo "Attempt ${i}: release not ready, retrying in 30s..."
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # Pre-1.0 releases are alpha by definition — flip the prerelease flag so
      # GitHub renders them as such. Drop this step (or tighten the regex)
      # once we cut v1.0.0.
      - name: Flag 0.x releases as pre-release
        if: startsWith(needs.check-version.outputs.tag, 'v0.')
        run: gh release edit "${{ needs.check-version.outputs.tag }}" --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
