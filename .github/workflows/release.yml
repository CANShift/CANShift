# Release — triggered by every merge to main.
# A release is only created when canshift-firmware/package.json version is new.
# If the version already has a GitHub Release, the workflow exits silently.
#
# To ship a release: bump the version in canshift-firmware/package.json in your PR.
# When that PR merges, this workflow fires and creates the GitHub Release automatically.
#
# Releases are firmware-only since the dash-hosted Studio refactor (#1077). The
# Studio SPA ships in the SPIFFS data partition (mirrored at build time from
# canshift-studio-web/dist/ by scripts/sync_studio_web.py per #1077 phase 4).
# The Electron canshift-studio/ package was decommissioned post-cutover — its
# installer (DMG / NSIS / AppImage) was already dropped per #1106 and the
# package itself is gone. canshift-flasher (separate repo, canshift.tmbk.ch)
# handles install / update over USB; mobile distributes through TestFlight /
# Play Store on its own cadence.

name: Release

# Only the secret-supplied OTA HMAC (`OTA_HMAC_SECRET`) produces a flashable
# artifact. The CI workflow uses a per-run `github.run_id` fallback so any
# CI-built image is intentionally non-flashable on production devices.

on:
  push:
    branches: [main]

# `cancel-in-progress: false` — never interrupt a partially-completed release
# (signing, asset uploads, draft creation must all reach a consistent state).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Detect whether this push introduces a new studio version
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # Source of truth: canshift-firmware/package.json `version`. This is also
      # read by canshift-firmware/scripts/extra_targets.py to inject
      # APP_VERSION_STR into the firmware binary, so the release tag and the
      # firmware splash can never disagree as long as both readers point here.
      #
      # History: source-of-truth was canshift-studio/package.json until the
      # Electron Studio package was decommissioned post-#1077 cutover. The
      # firmware is the only artifact in releases now, so the version
      # naturally tracks the firmware.
      - name: Read firmware version
        id: ver
        run: |
          VERSION=$(node -p "require('./canshift-firmware/package.json').version")
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.ver.outputs.tag }} already exists — skipping."
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "New version ${{ steps.ver.outputs.tag }} — will release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build firmware and attach .bin files to the GitHub Release
  firmware-release:
    name: Firmware — build & attach
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canshift-firmware

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.platformio/.packages
            ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('canshift-firmware/platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO CLI
        run: pip install platformio

      # Write the OTA HMAC secret consumed by `extra_targets.py` before the
      # production env builds. The guard introduced in #667 deliberately
      # refuses to compile the release env with the placeholder, so the
      # workflow needs a real key sourced from a repo secret. Set
      # `OTA_HMAC_SECRET` under Settings → Secrets and variables → Actions
      # (generate with `openssl rand -hex 32`). The same value must be
      # configured on the OTA backend so signed bins verify against it.
      # Closes #978.
      - name: Write secrets.ini for production firmware
        run: |
          if [ -z "${OTA_HMAC_SECRET:-}" ]; then
            echo "::error::OTA_HMAC_SECRET repo secret is not set — see #978 for setup."
            exit 1
          fi
          cat > secrets.ini <<EOF
          [ota]
          hmac_secret = ${OTA_HMAC_SECRET}
          EOF
        env:
          OTA_HMAC_SECRET: ${{ secrets.OTA_HMAC_SECRET }}

      - name: Build production firmware
        run: platformio run -e crowpanel_28

      - name: Assert APP_VERSION_STR was injected into firmware binary
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          ELF=.pio/build/crowpanel_28/firmware.elf
          # The boot banner LOG_INFO is compiled out in prod (APP_LOG_LEVEL=1)
          # so we can't rely on its string. The splash label literal
          # `"v" APP_VERSION_STR` in boot_sequence.cpp survives because it's a
          # plain string passed to lv_label_set_text. Use the explicit `0.0.0-unset`
          # fallback as the negative signal — if it appears, the macro wasn't
          # injected.
          if strings "$ELF" | grep -qF "0.0.0-unset"; then
            echo "::error::APP_VERSION_STR fell back to 0.0.0-unset in $ELF"
            echo "extra_targets.py likely failed to inject the macro into projenv."
            strings "$ELF" | grep -E "v[0-9]+\.[0-9]+\.[0-9]+|0\.0\.0-unset" | head -10
            exit 1
          fi
          if ! strings "$ELF" | grep -qF "v${VERSION}"; then
            echo "::error::APP_VERSION_STR mismatch — no 'v${VERSION}' literal in $ELF"
            strings "$ELF" | grep -E "v[0-9]+\.[0-9]+\.[0-9]+|0\.0\.0-unset" | head -10
            exit 1
          fi
          echo "APP_VERSION_STR=v${VERSION} confirmed in firmware ELF."

      - name: Build SPIFFS image
        run: platformio run --target buildfs -e crowpanel_28

      - name: Stage release assets (firmware partition, merged image, SPIFFS)
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          pip install esptool
          # Merged factory image — USB esptool flashing only (bootloader + partitions + firmware).
          python -m esptool --chip esp32 merge_bin \
            -o canshift-firmware-${TAG}-crowpanel_28-merged.bin \
            0x1000 .pio/build/crowpanel_28/bootloader.bin \
            0x8000 .pio/build/crowpanel_28/partitions.bin \
            0x10000 .pio/build/crowpanel_28/firmware.bin
          # Firmware-partition image — what mobile / studio OTA must consume.
          cp .pio/build/crowpanel_28/firmware.bin canshift-firmware-${TAG}-crowpanel_28-firmware.bin
          # SPIFFS image — flashed to the data partition.
          cp .pio/build/crowpanel_28/spiffs.bin canshift-spiffs-${TAG}-crowpanel_28.bin

      # Ed25519 sign every release binary so the flasher can verify the asset
      # before flashing over USB (issue #1259). The SHA-256 sidecar the
      # flasher used to consume defends against in-transit corruption only —
      # a compromised origin could swap both .bin and .sha256. An asymmetric
      # signature whose public counterpart is embedded in the flasher build
      # closes that gap.
      #
      # Secret format: `FIRMWARE_SIGNING_PRIVATE_KEY` = base64(PKCS8-PEM of
      # the Ed25519 private key). When the secret is absent the step warns
      # and exits 0 — the flasher's verification stays no-op until the
      # rollout reaches every release in the wild (see canshift-flasher #61).
      - name: Sign firmware artifacts with Ed25519
        run: |
          if [ -z "${FIRMWARE_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::FIRMWARE_SIGNING_PRIVATE_KEY repo secret not set —"
            echo "::warning::skipping .sig generation. Set the secret before the flasher"
            echo "::warning::starts enforcing signature verification (#1259)."
            exit 0
          fi
          pip install --quiet cryptography
          python3 scripts/sign_release_artifacts.py \
            canshift-firmware-${{ needs.check-version.outputs.tag }}-crowpanel_28-merged.bin \
            canshift-firmware-${{ needs.check-version.outputs.tag }}-crowpanel_28-firmware.bin \
            canshift-spiffs-${{ needs.check-version.outputs.tag }}-crowpanel_28.bin
        env:
          FIRMWARE_SIGNING_PRIVATE_KEY: ${{ secrets.FIRMWARE_SIGNING_PRIVATE_KEY }}

      # electron-builder used to create the draft Release as a side effect of
      # the (now-removed) studio-release job. With that job gone, the firmware
      # job is solely responsible for creating the Release before uploading
      # assets.
      - name: Create GitHub Release if missing
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          if ! gh release view "${TAG}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --title "${TAG}" \
              --notes "Firmware-only release. See README.md for the bundled changes." \
              --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach firmware, OTA partition image and SPIFFS to GitHub Release
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          MERGED="canshift-firmware-${TAG}-crowpanel_28-merged.bin"
          OTA="canshift-firmware-${TAG}-crowpanel_28-firmware.bin"
          FS="canshift-spiffs-${TAG}-crowpanel_28.bin"
          # Ed25519 signatures land alongside their .bin when the signing key
          # is configured (#1259). They are append-only assets so we glob
          # rather than name them explicitly — the workflow stays compatible
          # with the pre-signing world while the rollout completes.
          SIGS=()
          for f in "${MERGED}.sig" "${OTA}.sig" "${FS}.sig"; do
            [ -f "${f}" ] && SIGS+=("${f}")
          done
          for i in 1 2 3 4 5; do
            gh release upload "${TAG}" "${MERGED}" "${OTA}" "${FS}" "${SIGS[@]}" --clobber && break
            if [ $i -eq 5 ]; then exit 1; fi
            echo "Attempt ${i}: release not ready, retrying in 30s..."
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # Pre-1.0 releases are alpha by definition — flip the prerelease flag so
      # GitHub renders them as such. Drop this step (or tighten the regex)
      # once we cut v1.0.0.
      - name: Flag 0.x releases as pre-release
        if: startsWith(needs.check-version.outputs.tag, 'v0.')
        run: gh release edit "${{ needs.check-version.outputs.tag }}" --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
