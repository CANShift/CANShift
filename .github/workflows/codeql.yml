name: CodeQL

# Analyzes javascript-typescript only — C++ (firmware) and content-only (docs
# markdown) changes have nothing for it to scan, so both trigger on JS/TS paths.
on:
  push:
    branches: [main]
    paths: &jsPaths
      - 'canshift-core/**'
      - 'canshift-tuner/**'
      - 'canshift-mobile/**'
      - 'canshift-docs/**/*.ts'
      - 'canshift-docs/**/*.mjs'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths: *jsPaths
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
