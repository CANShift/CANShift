name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'
  OTA_HMAC_CI_FALLBACK: ${{ github.run_id }}

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      tuner: ${{ steps.filter.outputs.tuner }}
      mobile: ${{ steps.filter.outputs.mobile }}
      mobileNative: ${{ steps.filter.outputs.mobileNative }}
      firmware: ${{ steps.filter.outputs.firmware }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core: &core
              - 'canshift-core/**'
              - '.github/workflows/ci.yml'
            tuner:
              - *core
              - 'canshift-tuner/**'
            mobile:
              - *core
              - 'canshift-mobile/**'
            # The Xcode build only reacts to native config/deps, which live in
            # canshift-mobile/ — core TS changes are covered by mobile lint+test.
            mobileNative:
              - 'canshift-mobile/**'
              - '.github/workflows/ci.yml'
            firmware:
              - '.github/workflows/ci.yml'
              - 'canshift-firmware/**'
            docs:
              - '.github/workflows/ci.yml'
              - 'canshift-docs/**'

  core:
    name: core — lint + test + build
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canshift-core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  tuner:
    name: tuner — typecheck + test + build
    needs: changes
    if: ${{ needs.changes.outputs.tuner == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: build core
        working-directory: canshift-core
        run: |
          npm ci
          npm run build

      - name: tuner
        working-directory: canshift-tuner
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build

  mobile:
    name: mobile — lint + typecheck + test
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: build core
        working-directory: canshift-core
        run: |
          npm ci
          npm run build

      - name: mobile
        working-directory: canshift-mobile
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm test

  docs:
    name: docs — build
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canshift-docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci
      - run: npm run build

  firmware:
    name: firmware — build + tests + lint
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canshift-firmware
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/.packages
            canshift-firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('canshift-firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            canshift-firmware/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('canshift-firmware/rust/**/Cargo.toml', 'canshift-firmware/rust/**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install espup + esp32 Rust toolchain
        run: |
          if ! command -v espup >/dev/null; then
            cargo install espup --locked
          fi
          espup install --targets esp32
          . ~/export-esp.sh
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          for dir in $(echo "$PATH" | tr ':' '\n' | grep -E '(esp|rustup)' || true); do
            echo "$dir" >> "$GITHUB_PATH"
          done

      - name: Install PlatformIO
        run: pip install platformio

      - name: Write secrets.ini
        env:
          OTA_HMAC_SECRET: ${{ secrets.OTA_HMAC_SECRET }}
        run: |
          SECRET="${OTA_HMAC_SECRET:-${OTA_HMAC_CI_FALLBACK}}"
          printf "[ota]\nhmac_secret = %s\n" "$SECRET" > secrets.ini

      - name: clang-format
        run: |
          FILES=$(find src include -name "*.cpp" -o -name "*.h" | grep -v 'lv_conf\.h')
          clang-format --dry-run --Werror --style=file $FILES

      - name: native tests
        run: pio test -e native

      - name: build (crowpanel_28)
        run: pio run -e crowpanel_28 2>&1 | tee build.log

      - name: flash budget gate
        run: |
          PCT=$(grep '^Flash:' build.log | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          awk -v p="$PCT" 'BEGIN { exit (p > 98) ? 1 : 0 }' \
            || (echo "::error::flash ${PCT}% > 98% (#305 / #158)" && exit 1)

      - name: buildfs (crowpanel_28)
        run: pio run -e crowpanel_28 -t buildfs

      - name: verify spiffs round-trip
        run: |
          MKSPIFFS=$(find ~/.platformio/packages/tool-mkspiffs -name 'mkspiffs_espressif32_arduino' | head -1)
          if [ -z "$MKSPIFFS" ]; then
            echo "::error::mkspiffs binary not found"
            exit 1
          fi
          IMG=.pio/build/crowpanel_28/spiffs.bin
          if [ ! -f "$IMG" ]; then
            echo "::error::spiffs.bin not produced by buildfs"
            exit 1
          fi
          EXTRACT=$(mktemp -d)
          "$MKSPIFFS" -u "$EXTRACT" "$IMG" > /dev/null

          # File-list + content hash parity between source data/ and the
          # extracted image. Catches a path mkspiffs silently dropped (#1240)
          # and a truncated/corrupted mirror.
          (cd data && find . -type f | sort) > /tmp/src.list
          (cd "$EXTRACT" && find . -type f | sort) > /tmp/img.list
          SRC_COUNT=$(wc -l < /tmp/src.list | tr -d ' ')
          IMG_COUNT=$(wc -l < /tmp/img.list | tr -d ' ')
          echo "spiffs source files: $SRC_COUNT"
          echo "spiffs image files:  $IMG_COUNT"
          if ! diff /tmp/src.list /tmp/img.list > /tmp/list.diff; then
            echo "::error::spiffs file list mismatch — $SRC_COUNT source / $IMG_COUNT in image (#1240)"
            echo "::group::list diff"
            cat /tmp/list.diff
            echo "::endgroup::"
            exit 1
          fi
          (cd data && find . -type f | sort | xargs -I{} sha256sum {}) > /tmp/src.sha
          (cd "$EXTRACT" && find . -type f | sort | xargs -I{} sha256sum {}) > /tmp/img.sha
          if ! diff /tmp/src.sha /tmp/img.sha > /tmp/sha.diff; then
            echo "::error::spiffs content mismatch — bytes differ between data/ and extracted image"
            echo "::group::sha diff"
            cat /tmp/sha.diff
            echo "::endgroup::"
            exit 1
          fi

      - name: build (secure)
        run: pio run -e secure

  mobile-ios:
    name: mobile — iOS native build
    needs: changes
    if: ${{ needs.changes.outputs.mobileNative == 'true' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: canshift-mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - name: prebuild
        run: npx expo prebuild --clean --platform ios

      - name: xcodebuild
        working-directory: canshift-mobile/ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls | grep '\.xcworkspace$' | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --quieter

  ci-success:
    name: ci-success
    if: ${{ always() }}
    needs: [changes, core, tuner, mobile, docs, firmware, mobile-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if echo '${{ join(needs.*.result, ',') }}' | tr ',' '\n' | grep -qE '^(failure|cancelled)$'; then
            echo "::error::a required CI job failed or was cancelled"
            exit 1
          fi
          echo "all required jobs passed or were skipped"
