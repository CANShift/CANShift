name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'
  # CI artifacts are not meant to be HMAC-flashable. A stable cleartext fallback
  # would let any CI build be flashed under a known key if a regression ever
  # shipped one; using `github.run_id` gives each CI build a unique non-flashable
  # HMAC. The real secret lives in `release.yml` and is the only path to a
  # flashable artifact (#1291).
  OTA_HMAC_CI_FALLBACK: ${{ github.run_id }}

jobs:
  js:
    name: js — lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: core
        working-directory: canshift-core
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: studio-web
        working-directory: canshift-studio-web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: mobile
        working-directory: canshift-mobile
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm test

  firmware:
    name: firmware — build + tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canshift-firmware
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Node + studio-web npm ci so `scripts/sync_studio_web.py` (run from
      # `pio run` via extra_scripts) can build the SPA and mirror it into
      # `data/w/` before `buildfs`. Without this the script logs
      # "node_modules absent — skipping SPA build" and the SPIFFS round-trip
      # gate below ran against an SPA-less image while the firmware ELF was
      # built expecting `/w/...` at runtime (#1340).
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm ci (studio-web — needed to build the SPA into data/w/)
        working-directory: canshift-studio-web
        run: npm ci

      - uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/.packages
            canshift-firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('canshift-firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Write secrets.ini
        env:
          OTA_HMAC_SECRET: ${{ secrets.OTA_HMAC_SECRET }}
        run: |
          SECRET="${OTA_HMAC_SECRET:-${OTA_HMAC_CI_FALLBACK}}"
          printf "[ota]\nhmac_secret = %s\n" "$SECRET" > secrets.ini

      - name: clang-format
        run: |
          FILES=$(find src include -name "*.cpp" -o -name "*.h" | grep -v 'lv_conf\.h')
          clang-format --dry-run --Werror --style=file $FILES

      - name: native tests
        run: pio test -e native

      - name: build (crowpanel_28)
        run: pio run -e crowpanel_28 2>&1 | tee build.log

      - name: flash budget gate
        run: |
          PCT=$(grep '^Flash:' build.log | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          awk -v p="$PCT" 'BEGIN { exit (p > 98) ? 1 : 0 }' \
            || (echo "::error::flash ${PCT}% > 98% (#305 / #158)" && exit 1)

      # SPIFFS round-trip gate (#1240). mkspiffs silently drops files whose
      # on-device path exceeds SPIFFS_OBJ_NAME_LEN (31 chars including NUL);
      # when that happened in production the WiFi AP shipped a half-empty
      # bundle and every browser request 404'd. This step extracts the
      # produced image and fails the build if the file count diverges from
      # the source manifest in data/.
      - name: buildfs (crowpanel_28)
        run: pio run -e crowpanel_28 -t buildfs

      - name: verify spiffs round-trip
        run: |
          MKSPIFFS=$(find ~/.platformio/packages/tool-mkspiffs -name 'mkspiffs_espressif32_arduino' | head -1)
          if [ -z "$MKSPIFFS" ]; then
            echo "::error::mkspiffs binary not found"
            exit 1
          fi
          IMG=.pio/build/crowpanel_28/spiffs.bin
          if [ ! -f "$IMG" ]; then
            echo "::error::spiffs.bin not produced by buildfs"
            exit 1
          fi
          EXTRACT=$(mktemp -d)
          "$MKSPIFFS" -u "$EXTRACT" "$IMG" > /dev/null

          # Sanity gate: the SPA must be present in data/w/. Without this check
          # the firmware job used to ship an SPA-less SPIFFS image when
          # sync_studio_web.py couldn't reach node_modules — both sides counted
          # the same (committed-only) files and the gate passed silently (#1340).
          SPA_COUNT=$(find data/w -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$SPA_COUNT" -eq 0 ]; then
            echo "::error::data/w/ is empty — sync_studio_web.py skipped the SPA build (#1340)"
            exit 1
          fi
          echo "data/w/ files: $SPA_COUNT"

          # File-list parity. Catches a path that mkspiffs silently dropped
          # because the on-device path exceeded SPIFFS_OBJ_NAME_LEN (#1240).
          (cd data && find . -type f | sort) > /tmp/src.list
          (cd "$EXTRACT" && find . -type f | sort) > /tmp/img.list
          SRC_COUNT=$(wc -l < /tmp/src.list | tr -d ' ')
          IMG_COUNT=$(wc -l < /tmp/img.list | tr -d ' ')
          echo "spiffs source files: $SRC_COUNT"
          echo "spiffs image files:  $IMG_COUNT"
          if ! diff /tmp/src.list /tmp/img.list > /tmp/list.diff; then
            echo "::error::spiffs file list mismatch — $SRC_COUNT source / $IMG_COUNT in image (#1240)"
            echo "::group::list diff"
            cat /tmp/list.diff
            echo "::endgroup::"
            exit 1
          fi

          # Content parity. A file-count match isn't enough: a truncated or
          # corrupted mirror would have the right name but the wrong bytes,
          # and the device would serve a half-payload over WiFi. Hash both
          # trees and fail on the first diverging file (#1340).
          (cd data && find . -type f | sort | xargs -I{} sha256sum {}) > /tmp/src.sha
          (cd "$EXTRACT" && find . -type f | sort | xargs -I{} sha256sum {}) > /tmp/img.sha
          if ! diff /tmp/src.sha /tmp/img.sha > /tmp/sha.diff; then
            echo "::error::spiffs content mismatch — bytes differ between data/ and extracted image (#1340)"
            echo "::group::sha diff"
            cat /tmp/sha.diff
            echo "::endgroup::"
            exit 1
          fi

      - name: build (secure)
        # Exercise the secure-boot partition layout and SDK defaults on every PR
        # so changes to `ota_4mb_secure.csv` or `APP_SECURE_BOOT_BUILD=1`-gated
        # code paths can't break only at hand-build / release time (#1340).
        # No flash-budget gate here — the secure layout has different partition
        # sizing than `crowpanel_28`, so the existing 98 % rule wouldn't apply
        # cleanly. The build itself succeeding is the contract.
        run: pio run -e secure

  mobile-ios:
    name: mobile — iOS native build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: canshift-mobile
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - name: prebuild
        run: npx expo prebuild --clean --platform ios

      - name: xcodebuild
        working-directory: canshift-mobile/ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls | grep '\.xcworkspace$' | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --quieter
