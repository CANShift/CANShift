name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'
  OTA_HMAC_CI_FALLBACK: 'ci_fallback_not_for_production_use_change_for_release_workflow'

jobs:
  js:
    name: js — lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: core
        working-directory: canshift-core
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: studio-web
        working-directory: canshift-studio-web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: mobile
        working-directory: canshift-mobile
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm test

  firmware:
    name: firmware — build + tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canshift-firmware
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/.packages
            canshift-firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('canshift-firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Write secrets.ini
        env:
          OTA_HMAC_SECRET: ${{ secrets.OTA_HMAC_SECRET }}
        run: |
          SECRET="${OTA_HMAC_SECRET:-${OTA_HMAC_CI_FALLBACK}}"
          printf "[ota]\nhmac_secret = %s\n" "$SECRET" > secrets.ini

      - name: clang-format
        run: |
          FILES=$(find src include -name "*.cpp" -o -name "*.h" | grep -v 'lv_conf\.h')
          clang-format --dry-run --Werror --style=file $FILES

      - name: native tests
        run: pio test -e native

      - name: build (crowpanel_28)
        run: pio run -e crowpanel_28 2>&1 | tee build.log

      - name: flash budget gate
        run: |
          PCT=$(grep '^Flash:' build.log | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          awk -v p="$PCT" 'BEGIN { exit (p > 98) ? 1 : 0 }' \
            || (echo "::error::flash ${PCT}% > 98% (#305 / #158)" && exit 1)

  mobile-ios:
    name: mobile — iOS native build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: canshift-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - name: prebuild
        run: npx expo prebuild --clean --platform ios

      - name: xcodebuild
        working-directory: canshift-mobile/ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls | grep '\.xcworkspace$' | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --quieter
