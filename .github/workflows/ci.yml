# CI — runs on every push to main and on every pull request
# Checks: lint, typecheck, build for canshift-core and canshift-studio

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Shared core ────────────────────────────────────────────────────────────
  core:
    name: core — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canshift-core

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: canshift-core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: canshift-core-dist
          path: canshift-core/dist
          retention-days: 1

  # ─── Desktop studio ─────────────────────────────────────────────────────────
  studio:
    name: studio — lint + typecheck + build
    runs-on: ubuntu-latest
    needs: core
    defaults:
      run:
        working-directory: canshift-studio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: canshift-studio/package-lock.json

      - name: Download core dist
        uses: actions/download-artifact@v4
        with:
          name: canshift-core-dist
          path: canshift-core/dist

      - name: Install core dependencies
        run: npm ci
        working-directory: canshift-core

      - name: Install studio dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ─── Firmware ───────────────────────────────────────────────────────────────
  firmware:
    name: firmware — clang-format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canshift-firmware

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          FILES=$(find src include -name "*.cpp" -o -name "*.h" | grep -v "lv_conf\.h")
          clang-format --dry-run --Werror --style=file $FILES
