name: firmware-boot-smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'canshift-firmware/**'
      - '.github/workflows/firmware-boot-smoke.yml'

concurrency:
  group: firmware-boot-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boot-smoke:
    name: firmware — QEMU boot smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: canshift-firmware
    env:
      QEMU_TAG: esp-develop-9.2.2-20260417
      QEMU_ASSET: qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.packages
            ~/.platformio/.cache
          key: pio-boot-smoke-${{ runner.os }}-${{ hashFiles('canshift-firmware/platformio.ini') }}
          restore-keys: pio-boot-smoke-${{ runner.os }}-

      - run: pip install platformio esptool

      - run: pio run -e sim

      - run: pio run -t buildfs -e sim

      - uses: actions/cache@v4
        id: qemu-cache
        with:
          path: ~/qemu-esp
          key: qemu-esp-${{ env.QEMU_TAG }}

      - name: Install QEMU runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 libslirp0

      - name: Download Espressif QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/qemu-esp
          cd ~/qemu-esp
          curl -fL -o qemu.tar.xz \
            "https://github.com/espressif/qemu/releases/download/${QEMU_TAG}/${QEMU_ASSET}"
          tar -xJf qemu.tar.xz --strip-components=1
          rm qemu.tar.xz

      - name: Merge flash binary
        run: |
          esptool.py --chip esp32 merge_bin \
            --output flash.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB --fill-flash-size 4MB \
            0x1000   .pio/build/sim/bootloader.bin \
            0x8000   .pio/build/sim/partitions.bin \
            0x10000  .pio/build/sim/firmware.bin \
            0x370000 .pio/build/sim/spiffs.bin

      - name: Run QEMU + assert boot
        run: |
          set -euo pipefail
          export PATH="$HOME/qemu-esp/bin:$PATH"
          qemu-system-xtensa -nographic -machine esp32 -cpu esp32 \
            -drive file=flash.bin,if=mtd,format=raw -serial file:serial.log -no-reboot &
          PID=$!
          for i in $(seq 60); do
            grep -q '\[BOOT\] Ready' serial.log 2>/dev/null && break
            sleep 1
          done
          kill -9 "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          fail=0
          BANNER=$(grep -c 'CANShift v' serial.log || true)
          READY=$(grep -c '\[BOOT\] Ready' serial.log || true)
          RST=$(grep -c 'rst:0x' serial.log || true)
          [ "$BANNER" = 1 ] || { echo "::error::banner count=$BANNER (expected 1)"; fail=1; }
          [ "$READY" = 1 ]  || { echo "::error::ready  count=$READY (expected 1)"; fail=1; }
          [ "$RST" -le 1 ]  || { echo "::error::reset  count=$RST (boot loop)";  fail=1; }
          PRE=$(sed '/\[BOOT\] Ready/q' serial.log)
          for p in 'Guru Meditation' 'abort()' 'assert failed' 'Backtrace:'; do
            echo "$PRE" | grep -q "$p" && { echo "::error::pre-ready panic: $p"; fail=1; } || true
          done
          if [ "$fail" -ne 0 ]; then
            echo "::group::serial.log tail"; tail -n 200 serial.log; echo "::endgroup::"
            exit 1
          fi

      - name: Upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-smoke-serial-log
          path: canshift-firmware/serial.log
